name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Keep the checks used by a production deployment running to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_LOG_PATH: .wrangler/logs

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Biome
        run: nix develop --command pnpm lint
      - name: TypeScript
        run: nix develop --command pnpm typecheck
      - name: Check Nix definitions
        run: |
          nix flake check --all-systems --no-build
          nix fmt -- --check flake.nix
      - name: Check shell scripts
        run: nix develop --command shellcheck scripts/*.sh
      - name: Check GitHub Actions workflows
        run: nix develop --command actionlint -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Reject tracked local environment files
        run: nix develop --command bash scripts/reject-local-environment-files.sh --tracked
      - name: Verify repository safety checks
        run: nix develop --command pnpm test:repo
      - name: Scan complete Git history
        run: >-
          nix develop --command betterleaks git . --log-opts="--all" --config=.betterleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - name: Scan checkout
        run: >-
          nix develop --command betterleaks dir . --config=.betterleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Audit production and development dependencies
        run: nix develop --command pnpm audit:deps

  test-build:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: nix develop --command pnpm test
      - name: Verify random-state FTO generator
        run: nix develop --command pnpm verify:scrambler
      - name: Build production assets
        run: nix develop --command pnpm build
      - name: Validate Workers deployment without publishing
        run: nix develop --command pnpm deploy:dry-run
      - name: Install Chromium
        timeout-minutes: 5
        # GitHub-hosted Ubuntu already includes Chrome's runtime libraries.
        # Download the pinned Playwright browser without refreshing apt mirrors.
        run: nix develop --command pnpm exec playwright install --only-shell chromium
      - name: Browser tests against Vite production preview
        timeout-minutes: 5
        run: nix develop --command pnpm test:e2e
      - name: Browser tests against Workers local runtime
        timeout-minutes: 5
        run: nix develop --command pnpm test:e2e:workers
      - name: Scan built assets
        run: >-
          nix develop --command betterleaks dir apps/web/dist --config=.betterleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - name: Save verified production assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
