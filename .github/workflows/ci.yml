name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let production runs finish; superseded PR/branch checks can be cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_LOG_PATH: .wrangler/logs

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Biome
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Install actionlint
        run: bash .github/scripts/install-ci-tool.sh actionlint
      - name: Check GitHub Actions workflows
        run: actionlint -color

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: bash .github/scripts/install-ci-tool.sh gitleaks
      - name: Scan complete Git history
        run: >-
          gitleaks git . --log-opts="--all" --config=.gitleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - name: Scan checkout
        run: >-
          gitleaks dir . --config=.gitleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  test-build:
    name: Tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Unit tests
        run: pnpm test
      - name: Verify random-state FTO generator
        run: pnpm verify:scrambler
      - name: Build production assets
        run: pnpm build
      - name: Validate Workers deployment without publishing
        run: pnpm deploy:dry-run
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Browser tests against Vite production preview
        run: pnpm test:e2e
      - name: Browser tests against Workers local runtime
        run: pnpm test:e2e:workers
      - name: Install Gitleaks
        run: bash .github/scripts/install-ci-tool.sh gitleaks
      - name: Scan built assets
        run: >-
          gitleaks dir apps/web/dist --config=.gitleaks.toml
          --redact=100 --no-banner --no-color --ignore-gitleaks-allow
      - name: Save verified production assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [static-checks, secret-scan, test-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: cloudflare-workers-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download this run's verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist-${{ github.sha }}
          path: apps/web/dist
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment. See docs/DEPLOYMENT.md."
            exit 1
          fi
          pnpm deploy:workers --message "GitHub Actions commit $GITHUB_SHA"
