packages:
  - apps/*
  - packages/*
engineStrict: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
saveExact: true
storeDir: .pnpm-store
cacheDir: .pnpm-cache
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
  - miniflare@5.20260925.0-alpha
  - wrangler@4.141.0
allowBuilds:
  esbuild: true
  workerd: true
