packages:
  - apps/*
  - packages/*
engineStrict: true
verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
saveExact: true
storeDir: .pnpm-store
cacheDir: .pnpm-cache
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.2'
  - '@vitest/spy@5.0.2'
  - vitest@5.0.2
  - miniflare@5.20260925.0-alpha
  - wrangler@4.141.0
allowBuilds:
  esbuild: true
  workerd: true
overrides:
  # Keep the patches while the pinned upstream dependencies still use vulnerable versions.
  # https://github.com/advisories/GHSA-rfgv-xxqx-mfg5
  undici@7.29.0: 7.29.1
  # https://github.com/advisories/GHSA-68fv-2mgg-jv7q
  source-map-js@1.2.1: 1.2.2
